
name: Build AdminCore MAX Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Extract AdminCore MAX Edition
        run: |
          unzip -q AdminCore-Paper-26.1.2-MAX-Edition.zip -d extracted
          ls -la extracted/AdminCore

      - name: Build Plugin
        run: |
          cd extracted/AdminCore
          mvn -B -ntp clean package

      - name: Upload AdminCore JAR
        uses: actions/upload-artifact@v4
        with:
          name: AdminCore-MAX-Plugin
          path: extracted/AdminCore/target/*.jar
          if-no-files-found: error
