
name: Build AdminCore MAX Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract MAX Edition
        run: |
          unzip -q AdminCore-Paper-26.1.2-MAX-Edition.zip -d extracted

      - name: Find Maven Project
        run: |
          POM=$(find extracted -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build Plugin
        run: |
          cd "$PROJECT_DIR"
          mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AdminCore-MAX-Plugin
          path: extracted/**/target/*.jar
          if-no-files-found: error
